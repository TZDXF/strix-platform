[project]
name = "strix-backend"
version = "0.1.0"
description = "STRIX 平台后端（FastAPI API + Celery worker）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "celery[redis]>=5.4",
    "boto3>=1.34",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
    # worker 侧需要 strix 引擎（版本 pin，Phase 0 实测基线）
    "strix-agent==1.5.3",
]

[tool.uv]
# 纯应用目录，不是可安装的包：uv sync 只安装 dependencies
package = false
