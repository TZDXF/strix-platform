name: strix-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: strix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strix}
      POSTGRES_DB: strix
    volumes:
      - ./docker/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strix"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  rustfs:
    # S3 兼容对象存储（run 产物归档）；代码侧仅用 S3 API，后端可替换
    image: ghcr.io/rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-strix-platform}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-strix-platform-secret}
      RUSTFS_VOLUMES: /data
    volumes:
      - ./docker/data/rustfs:/data
    # 首次启动后手动创建桶 strix-platform（见 README）

  api:
    build: ./backend
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg2://strix:${POSTGRES_PASSWORD:-strix}@postgres:5432/strix
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?must set SECRET_KEY}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-strix-admin-123}
      # strix 沙箱由宿主 daemon 创建、bind mount 源码目录，因此容器内的工作区路径
      # 必须同时是 daemon 可解析的路径：Docker Desktop 下宿主磁盘挂在其 VM 的
      # /run/desktop/mnt/host/<盘符>/ 下，WORKSPACE_CONTAINER_ROOT 需指向该路径；
      # 原生 Linux 部署则把 WORKSPACE_HOST_DIR 与 WORKSPACE_CONTAINER_ROOT 设为同一宿主绝对路径
      WORKSPACE_ROOT: ${WORKSPACE_CONTAINER_ROOT:-/data/workspaces}
      STRIX_BIN: strix
      STRIX_LLM: ${STRIX_LLM:-free}
      FREE_MODELS: ${FREE_MODELS:-free}
      LLM_API_BASE: ${LLM_API_BASE:?must set LLM_API_BASE}
      S3_ENABLED: "true"
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-strix-platform}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:-strix-platform-secret}
      S3_BUCKET: strix-platform
      TARGET_ALLOWLIST: ${TARGET_ALLOWLIST:-}
      STRIX_MAX_BUDGET: ${STRIX_MAX_BUDGET:-0}
      STRIX_EXTRA_ARGS: ${STRIX_EXTRA_ARGS:-}
      # 联网搜索（可选）：内网 MCP 搜索端点；配置后任务提交时可勾选启用
      WEB_SEARCH_MCP_URL: ${WEB_SEARCH_MCP_URL:-}
    volumes:
      - type: bind
        source: ${WORKSPACE_HOST_DIR:-./docker/data/workspaces}
        target: ${WORKSPACE_CONTAINER_ROOT:-/data/workspaces}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    # --beat：内嵌 celery beat，每分钟轮询到期定时扫描计划（见 app/schedules.py）
    command: celery -A app.celery_app.celery_app worker --pool=solo --beat --loglevel=info -n worker1
    environment:
      <<: *backend_env
      # strix 在容器内运行时，沙箱须加入 worker 所在网络，Caido 代理走容器 IP 直连；
      # 不设置时端口解析为 127.0.0.1:<宿主发布端口>，容器内不可达 → Instance not ready
      STRIX_DOCKER_SANDBOX_NETWORK: strix-sandbox
    networks:
      - default
      - strix-sandbox
    volumes:
      - type: bind
        source: ${WORKSPACE_HOST_DIR:-./docker/data/workspaces}
        target: ${WORKSPACE_CONTAINER_ROOT:-/data/workspaces}
      - /var/run/docker.sock:/var/run/docker.sock   # strix 沙箱需要 Docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "80:80"

# 所有数据已改为 bind mount 映射到 ./docker/data/ 下

networks:
  strix-sandbox:
    name: strix-sandbox
