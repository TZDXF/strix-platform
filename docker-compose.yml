name: strix-platform

services:
  postgres:
    # 宿主 ./docker/data/postgres 由 PG16 初始化；换成 15 会因数据目录不兼容拒启
    image: postgres:16
    environment:
      POSTGRES_USER: strix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strix}
      POSTGRES_DB: strix
    volumes:
      - ./docker/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strix"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.2
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  rustfs:
    # S3 兼容对象存储（run 产物归档）；代码侧仅用 S3 API，后端可替换
    image: ghcr.io/rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-strix-platform}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-strix-platform-secret}
      RUSTFS_VOLUMES: /data
    volumes:
      - ./docker/data/rustfs:/data
    # 首次启动后手动创建桶 strix-platform（见 README）

  api:
    build: ./backend
    # 启动命令必须显式给出（设置了 entrypoint 后 compose 不再继承镜像 CMD）；
    # entrypoint 仅做工作区路径诊断，路径对齐由仓库根目录 ./deploy.sh 自动注入
    entrypoint: ["python", "-m", "app.entrypoint"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg2://strix:${POSTGRES_PASSWORD:-strix}@postgres:5432/strix
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?must set SECRET_KEY}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-admin}
      # strix 沙箱由宿主 daemon 创建、bind mount 源码目录：bind 源按 daemon 所在
      # 文件系统解析且须真实存在。这里用固定名具名卷承载工作区，并把容器内挂载点
      # 设为该卷在 daemon 侧的存储路径（Windows/macOS Desktop 与原生 Linux 同为
      # 该常量），worker/api 与沙箱三方路径天然同串对齐，直接 docker compose up 即可，
      # 无需按平台探测注入（历史行为见 git 的 deploy.sh）。
      WORKSPACE_ROOT: /var/lib/docker/volumes/strix-platform_workspaces/_data
      STRIX_LLM: ${STRIX_LLM:-free}
      LLM_API_BASE: ${LLM_API_BASE:?must set LLM_API_BASE}
      S3_ENABLED: "true"
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-strix-platform}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:-strix-platform-secret}
      S3_BUCKET: strix-platform
      TARGET_ALLOWLIST: ${TARGET_ALLOWLIST:-}
      STRIX_MAX_BUDGET: ${STRIX_MAX_BUDGET:-0}
      STRIX_EXTRA_ARGS: ${STRIX_EXTRA_ARGS:-}
      # 联网搜索（可选）：内网 MCP 搜索端点；配置后任务提交时可勾选启用
      WEB_SEARCH_MCP_URL: ${WEB_SEARCH_MCP_URL:-}
    volumes:
      - workspaces:/var/lib/docker/volumes/strix-platform_workspaces/_data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    entrypoint: ["python", "-m", "app.entrypoint"]
    # --beat：内嵌 celery beat，每分钟轮询到期定时扫描计划（见 app/schedules.py）
    command: celery -A app.celery_app.celery_app worker --pool=solo --beat --loglevel=info -n worker1
    environment:
      <<: *backend_env
      # strix 在容器内运行时，沙箱须加入 worker 所在网络，Caido 代理走容器 IP 直连；
      # 不设置时端口解析为 127.0.0.1:<宿主发布端口>，容器内不可达 → Instance not ready
      STRIX_DOCKER_SANDBOX_NETWORK: strix-sandbox
    networks:
      - default
      - strix-sandbox
    volumes:
      - workspaces:/var/lib/docker/volumes/strix-platform_workspaces/_data
      - /var/run/docker.sock:/var/run/docker.sock   # strix 沙箱需要 Docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "80:80"

# 工作区用固定名具名卷承载（见上方 WORKSPACE_ROOT 注释）；postgres/rustfs 数据
# 仍 bind mount 到 ./docker/data/ 下
volumes:
  # 显式固定卷名：与其在 daemon 侧的真实存储路径
  # /var/lib/docker/volumes/strix-platform_workspaces/_data 保持一致，
  # 不随 COMPOSE_PROJECT_NAME / docker compose -p 变化
  workspaces:
    name: strix-platform_workspaces

networks:
  strix-sandbox:
    name: strix-sandbox
